name: CI

on:
  push:
    branches: [ main, 2.0.0 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, 2.0.0 ]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wp: '7.0'
          - php: '8.1'
            wp: '7.0'
          - php: '8.2'
            wp: '7.0'
          - php: '8.3'
            wp: '7.0'
          - php: '8.4'
            wp: '7.0'

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      WP_VERSION: ${{ matrix.wp }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y git unzip
      - name: Setup PHP extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mysqli
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Check object cache API parity
        run: composer check:cache-api

      - name: PHPStan static analysis
        run: composer phpstan

      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -not -path './.cache/*' -not -path './dist/*' -not -path './$WP_TESTS_DIR/*' -print0 | xargs -0 -n 1 -P 4 php -l

      - name: Coding standards
        run: composer lint

      - name: Run WordPress PHPUnit
        run: bash run-tests.sh --php ${{ matrix.php }} --wp ${{ matrix.wp }} --all
